[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "citegate"
version = "0.1.0"
description = "Evals as unit tests for citation-grounded public-sector AI agents: multilingual, statistically gated and mutation-tested."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dhia Chaieb" }]
keywords = ["llm", "evaluation", "rag", "agents", "ci", "multilingual", "arabic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/ChaiebDhia/citegate"
Issues = "https://github.com/ChaiebDhia/citegate/issues"
Changelog = "https://github.com/ChaiebDhia/citegate/blob/main/CHANGELOG.md"
"Live report" = "https://chaiebdhia.github.io/citegate/"

[project.scripts]
citegate = "citegate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/citegate"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic and French text is intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018", "E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=citegate --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.report]
exclude_also = ["pragma: no cover", "if __name__ == .__main__.:"]
